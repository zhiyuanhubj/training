version: 1

# Paths are directory names below $NFS_DIR/data. The launcher validates them
# against root/canonical_index.json before training.
format: parquet
root: LLaVA-OneVision-1.5-Instruct-Data-qwen-format
val: LLaVA-OneVision-1.5-Instruct-Data-qwen-format-val
download: never
hf_max_workers: 8

# Data-loader and mixture behavior belongs here, not in the model/job config.
loader:
  streaming: true
  dataset_shuffle: true
  shuffle_buffer_size: 10000
  dataset_mix: interleave
  interleave_unit: subdataset
  # Probabilities are proportional to rows * passes.
  interleave_weight: sample_count
  stopping_strategy: all_exhausted
  enable_channel_loss: true
  # Canonical rows already carry the normalized subdataset name here.
  channel_column: data_source
  add_genshin_special_tokens: false

# passes is the total exposure multiplier for this training task. All canonical
# LLaVA-OneVision subdatasets currently receive one full pass.
